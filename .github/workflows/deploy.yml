name: Deploy RyskNode FastAPI

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: rysknode-fastapi-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy FastAPI to production
    runs-on: [self-hosted, rysknode-fastapi]

    env:
      APP_NAME: Rysknode-LogicModel-Scrapper
      APP_DIR: /var/www/RyskNode_LogicModel_Scrapper
      SERVICE_NAME: rysknode-fastapi
      APP_PORT: ${{ secrets.APP_PORT }}
      UV_BIN: /home/ubuntu/.local/bin/uv

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Show deployment info
        run: |
          echo "Deploying branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "App directory: $APP_DIR"
          echo "Service: $SERVICE_NAME"
          echo "Port: $APP_PORT"
      - name: Verify required tools
        run: |
          command -v rsync
          test -x "$UV_BIN"
          sudo -n systemctl status "$SERVICE_NAME" --no-pager >/dev/null || true

      - name: Ensure production directory exists
        run: |
          mkdir -p "$APP_DIR"

      - name: Sync code to production directory
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".env" \
            --exclude ".venv" \
            --exclude "__pycache__" \
            --exclude ".pytest_cache" \
            --exclude ".mypy_cache" \
            --exclude ".ruff_cache" \
            --exclude "reports" \
            --exclude "*.pyc" \
            ./ "$APP_DIR/"
      - name: Create production .env from GitHub Secrets and Variables
        working-directory: ${{ env.APP_DIR }}
        run: |
          cat > .env <<EOF
          APP_ENV=${{ secrets.APP_ENV }}
          APP_PORT=${{ secrets.APP_PORT }}
          ENABLE_API_SERVER=${{ vars.ENABLE_API_SERVER }}
          SQLALCHEMY_URI=${{ secrets.SQLALCHEMY_URI }}
          DATA_GOV_API_KEY=${{ secrets.DATA_GOV_API_KEY }}
          DATA_GOV_RESOURCE_ID=4dbe5667-7b6b-41d7-82af-211562424d9a
          DATA_GOV_BASE_URL=https://api.data.gov.in/resource
          DATA_GOV_RATE_LIMIT_COOLDOWN=120
          DATA_GOV_API_LIMIT=1000
          CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}
          CELERY_APP_CONF=${{ vars.CELERY_APP_CONF }}
          ENABLE_CELERY_WORKER=${{ vars.ENABLE_CELERY_WORKER }}
          ENABLE_QUEUE_DEFAULT=${{ vars.ENABLE_QUEUE_DEFAULT }}
          CELERY_QUEUE_DEFAULT=${{ vars.CELERY_QUEUE_DEFAULT }}
          CELERY_CONCURRENCY_DEFAULT=${{ vars.CELERY_CONCURRENCY_DEFAULT }}
          ENABLE_QUEUE_BUYER_RISK=${{ vars.ENABLE_QUEUE_BUYER_RISK }}
          CELERY_QUEUE_BUYER_RISK=${{ vars.CELERY_QUEUE_BUYER_RISK }}
          CELERY_CONCURRENCY_BUYER_RISK=${{ vars.CELERY_CONCURRENCY_BUYER_RISK }}
          ENABLE_QUEUE_CREDIT_LIMIT=${{ vars.ENABLE_QUEUE_CREDIT_LIMIT }}
          CELERY_QUEUE_CREDIT_LIMIT=${{ vars.CELERY_QUEUE_CREDIT_LIMIT }}
          CELERY_CONCURRENCY_CREDIT_LIMIT=${{ vars.CELERY_CONCURRENCY_CREDIT_LIMIT }}
          ENABLE_QUEUE_VDD=${{ vars.ENABLE_QUEUE_VDD }}
          CELERY_QUEUE_VDD=${{ vars.CELERY_QUEUE_VDD }}
          CELERY_CONCURRENCY_VDD=${{ vars.CELERY_CONCURRENCY_VDD }}
          CELERY_TASK_TIME_LIMIT=${{ vars.CELERY_TASK_TIME_LIMIT }}
          CELERY_TASK_SOFT_TIME_LIMIT=${{ vars.CELERY_TASK_SOFT_TIME_LIMIT }}
          CELERY_VISIBILITY_TIMEOUT=${{ vars.CELERY_VISIBILITY_TIMEOUT }}
          CELERY_RESULT_EXPIRES=${{ vars.CELERY_RESULT_EXPIRES }}
          CELERY_WORKER_MAX_TASKS_PER_CHILD=${{ vars.CELERY_WORKER_MAX_TASKS_PER_CHILD }}
          CELERY_TIMEZONE=${{ vars.CELERY_TIMEZONE }}
          ENABLE_CELERY_FLOWER=${{ vars.ENABLE_CELERY_FLOWER }}
          CELERY_FLOWER_PORT=${{ vars.CELERY_FLOWER_PORT }}
          CELERY_FLOWER_URL_PREFIX=${{ vars.CELERY_FLOWER_URL_PREFIX }}
          CELERY_FLOWER_USER=${{ secrets.CELERY_FLOWER_USER }}
          CELERY_FLOWER_PASSWORD=${{ secrets.CELERY_FLOWER_PASSWORD }}
          ENABLE_CELERY_EVENTS=${{ vars.ENABLE_CELERY_EVENTS }}
          CELERY_EVENT_APP_NAME=${{ vars.CELERY_EVENT_APP_NAME }}
          EOF

          chmod 600 .env

      - name: Verify generated .env
        working-directory: ${{ env.APP_DIR }}
        run: |
          test -f .env
          grep -q "^APP_ENV=." .env
          grep -q "^APP_PORT=." .env
          grep -q "^SQLALCHEMY_URI=." .env
          grep -q "^DATA_GOV_API_KEY=." .env
          grep -q "^DATA_GOV_RESOURCE_ID=." .env
          grep -q "^DATA_GOV_BASE_URL=." .env
          grep -q "^DATA_GOV_RATE_LIMIT_COOLDOWN=." .env
          grep -q "^CELERY_BROKER_URL=." .env
          grep -q "^CELERY_FLOWER_USER=." .env
          grep -q "^CELERY_FLOWER_PASSWORD=." .env
          echo ".env generated successfully"
      - name: Install or update dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -f uv.lock ]; then
            "$UV_BIN" sync --frozen
          else
            "$UV_BIN" sync
          fi

      - name: Restart FastAPI service
        run: |
          sudo -n systemctl restart "$SERVICE_NAME"

      - name: Wait for app to start
        run: |
          for i in {1..20}; do
            if curl -fsS "http://127.0.0.1:${APP_PORT}/docs" >/dev/null; then
              echo "FastAPI is healthy"
              exit 0
            fi

            echo "Waiting for FastAPI... attempt $i"
            sleep 2
          done

          echo "FastAPI health check failed"
          sudo -n systemctl status "$SERVICE_NAME" --no-pager || true
          sudo -n journalctl -u "$SERVICE_NAME" -n 100 --no-pager || true
          exit 1
      - name: Show final service status
        run: |
          sudo -n systemctl status "$SERVICE_NAME" --no-pager